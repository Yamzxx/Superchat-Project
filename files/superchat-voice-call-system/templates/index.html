<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SuperChat AI — Voice Call</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/css/style.css" />
</head>
<body>

  <!-- Ambient background blobs -->
  <div class="ambient" aria-hidden="true">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
  </div>

  <div class="shell">

    <!-- ── HEADER ── -->
    <header class="hdr">
      <div class="hdr-brand">
        <div class="brand-icon" aria-hidden="true">
          <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="16" cy="16" r="15" stroke="url(#bg)" stroke-width="1.5"/>
            <path d="M9 12 Q16 8 23 12 L23 18 Q16 22 9 18 Z" fill="url(#bg)" opacity=".6"/>
            <circle cx="16" cy="15" r="3" fill="white"/>
            <defs>
              <linearGradient id="bg" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
                <stop stop-color="#6ee7f7"/>
                <stop offset="1" stop-color="#a78bfa"/>
              </linearGradient>
            </defs>
          </svg>
        </div>
        <span class="brand-name">SuperChat <em>AI</em></span>
      </div>

      <div class="hdr-meta">
        <span class="conn-dot" id="connDot" aria-hidden="true"></span>
        <span class="conn-label" id="connLabel">Idle</span>
      </div>
    </header>

    <!-- ── CALL CARD ── -->
    <main class="call-card">

      <!-- Avatar & timer -->
      <section class="avatar-zone">
        <div class="avatar-ring" id="avatarRing" aria-hidden="true">
          <div class="avatar-inner">
            <svg class="ai-icon" viewBox="0 0 48 48" fill="none">
              <circle cx="24" cy="24" r="23" stroke="url(#ar)" stroke-width="1"/>
              <path d="M14 20 Q24 14 34 20 L34 28 Q24 34 14 28 Z" fill="url(#ar)" opacity=".4"/>
              <circle cx="24" cy="24" r="5" fill="white"/>
              <defs>
                <linearGradient id="ar" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
                  <stop stop-color="#6ee7f7"/><stop offset="1" stop-color="#a78bfa"/>
                </linearGradient>
              </defs>
            </svg>
          </div>
        </div>

        <h2 class="ai-name">SuperChat AI</h2>
        <p class="call-timer" id="callTimer" aria-live="polite">00:00</p>
        <p class="status-label" id="statusLabel" aria-live="polite">Ready to connect</p>
      </section>

      <!-- Voice visualiser bars -->
      <div class="visualiser" id="visualiser" aria-hidden="true">
        <span></span><span></span><span></span><span></span>
        <span></span><span></span><span></span><span></span>
      </div>

      <!-- ── TRANSCRIPT ── -->
      <section class="transcript-panel" aria-label="Conversation transcript">
        <div class="transcript-hdr">
          <span class="t-label">Live Transcript</span>
          <button class="clear-btn" id="clearBtn" title="Clear transcript" aria-label="Clear transcript">
            <svg viewBox="0 0 16 16" fill="none"><path d="M2 4h12M6 4V2h4v2M13 4l-1 10H4L3 4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
          </button>
        </div>
        <div class="transcript-body" id="transcriptBody">
          <p class="t-placeholder">Your conversation will appear here…</p>
        </div>
      </section>

      <!-- ── CONTROLS ── -->
      <section class="controls" aria-label="Call controls">
        <button class="ctrl-btn mute-btn" id="muteBtn" title="Mute" aria-label="Mute" disabled>
          <svg class="icon-mic" viewBox="0 0 24 24" fill="none">
            <rect x="9" y="2" width="6" height="12" rx="3" stroke="currentColor" stroke-width="1.8"/>
            <path d="M5 10a7 7 0 0 0 14 0" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
            <line x1="12" y1="17" x2="12" y2="22" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
            <line x1="9" y1="22" x2="15" y2="22" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          </svg>
          <svg class="icon-muted" viewBox="0 0 24 24" fill="none" style="display:none">
            <rect x="9" y="2" width="6" height="12" rx="3" stroke="currentColor" stroke-width="1.8"/>
            <path d="M5 10a7 7 0 0 0 14 0" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
            <line x1="12" y1="17" x2="12" y2="22" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
            <line x1="9" y1="22" x2="15" y2="22" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
            <line x1="4" y1="4" x2="20" y2="20" stroke="#f87171" stroke-width="1.8" stroke-linecap="round"/>
          </svg>
        </button>

        <button class="ctrl-btn call-btn" id="callBtn" aria-label="Start call">
          <svg viewBox="0 0 24 24" fill="none">
            <path d="M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C10.6 21 3 13.4 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1L6.6 10.8z" fill="currentColor"/>
          </svg>
        </button>

        <button class="ctrl-btn end-btn" id="endBtn" title="End call" aria-label="End call" disabled>
          <svg viewBox="0 0 24 24" fill="none">
            <path d="M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C10.6 21 3 13.4 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1L6.6 10.8z" fill="currentColor" transform="rotate(135 12 12)"/>
          </svg>
        </button>
      </section>

      <!-- Error toast -->
      <div class="toast" id="toast" role="alert" aria-live="assertive"></div>

    </main>

  </div><!-- /shell -->

  <!-- Hidden audio player -->
  <audio id="aiAudio" style="display:none"></audio>

  <script src="/static/js/script.js"></script>
</body>
</html>
